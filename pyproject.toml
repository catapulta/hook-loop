[project]
name = "hook-loop"
version = "0.1.0"
description = "Parametric 3D-printable boat-hook adapter for a PVC docking stick"
requires-python = ">=3.12"
dependencies = ["build123d>=0.11.1"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
view = ["yacv-server>=0.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Part modules live at the repo root, not in an installed package.
pythonpath = ["."]
